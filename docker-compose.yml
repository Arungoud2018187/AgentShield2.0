services:
  # Backend Service: FastAPI with production Uvicorn workers
  backend:
    image: agentshield-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    container_name: agentshield-backend
    restart: unless-stopped
    network_mode: host
    environment:
      APP_NAME: AgentShield
      APP_VERSION: 1.0.0
      DEBUG: "False"
      HOST: 0.0.0.0
      PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-agentshield_production_secret_key_2026_secured}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 60
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_ENCODED:-Postgres%40123}@${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-agentshield}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}

  # Frontend Service: Nginx serving production build & proxying /api
  frontend:
    image: agentshield-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentshield-frontend
    restart: unless-stopped
    depends_on:
      - backend
    network_mode: host
    environment:
      PORT: ${FRONTEND_PORT:-80}
      BACKEND_HOST: ${BACKEND_HOST:-127.0.0.1}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
